[package]
name = "minuend-watch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Independent MINUEND vault-AA watcher: replays da_unit batches and flags root mismatches"

[[bin]]
name = "minuend-watch"
path = "src/main.rs"

[dependencies]
minuend-types = { path = "../minuend-types" }
minuend-dag = { path = "../minuend-dag" }
minuend-exec = { path = "../minuend-exec" }
minuend-state = { path = "../minuend-state" }
minuend-settle = { path = "../minuend-settle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = "3"
minuend-account = { path = "../minuend-account" }
minuend-types = { path = "../minuend-types" }
