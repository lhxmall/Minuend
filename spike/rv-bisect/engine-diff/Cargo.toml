[package]
name = "engine-diff"
version = "0.1.0"
edition = "2021"
description = "Host differential harness: real Minuend engine (fix/47-all @ 20326c0, std) vs the mnpilot port"

[dependencies]
# Real engine sources: ./fetch-engine.sh extracts fix/47-all @ 20326c0 into ../engine-src (not committed).
minuend-exec = { path = "../engine-src/crates/minuend-exec" }
minuend-dag = { path = "../engine-src/crates/minuend-dag" }
minuend-state = { path = "../engine-src/crates/minuend-state" }
minuend-types = { path = "../engine-src/crates/minuend-types" }
minuend-book = { path = "../engine-src/crates/minuend-book" }
minuend-account = { path = "../engine-src/crates/minuend-account" }
ed25519-dalek = "3"
sha2 = "0.10"
mnpilot = { path = "../guest-engine", default-features = false }

[features]
# loop round 2 (W2) test build: MNWIT1 MAX_WIT_DEPTH = 8 in the port and the reference verifier
depth8 = ["mnpilot/depth8"]
# loop round 9 (R7-L3): governance leaves prop: / cmt: / gnon: in the port and in the real-engine mirror
govwit = ["mnpilot/govwit"]
# loop round 15: govwit is the default (see guest-engine/Cargo.toml)
default = ["govwit"]
# loop round 14: stateless guest prototype differential (slfuzz / sladv)
stateless = ["mnpilot/stateless"]

[profile.release]
opt-level = 3
debug = false

# loop round 20: the test binary's own profile (target-spike/l20/), so mutant builds (release) in the shared
# CARGO_TARGET_DIR never overwrite it
[profile.l20]
inherits = "release"

# loop round 22: mutant builds of round 22 (target-spike/l22m/), apart from a still running earlier mutant pass (release)
[profile.l22m]
inherits = "release"

# loop round 23: mutant builds of round 23 (target-spike/l23m/)
[profile.l23m]
inherits = "release"

[workspace]
