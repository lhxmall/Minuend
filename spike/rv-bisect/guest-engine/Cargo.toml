[package]
name = "mnpilot"
version = "0.1.0"
edition = "2021"
description = "Minuend engine pilot port (no_std + alloc) for the riscv32im dispute guest"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rvengine"
path = "src/main.rs"

[features]
# sail spot-check build: read the batch from memory at 0x0300_0000 (loaded as a data ELF)
# instead of the ecall a7=63 input tree, which sail does not model.
embed = []
# no per-unit witness commitment (the 2d01fe8 pilot numbers)
nowit = []
# legacy full witness rebuild (sort + Obyte merkle) after every unit >= input word 3 (cost comparison)
legacywit = []
# test build: MNWIT1 MAX_WIT_DEPTH = 8 instead of 64 (loop round 2, W2: grind-able on a laptop)
depth8 = []
# loop round 3 (H1): the rollup's committed image -- header flags (word 3) must be 0 (status 4)
prod = []
# loop round 9 (R7-L3): governance state (proposals, commits, gov nonces) as MNWIT1 leaves prop: / cmt: / gnon:
# (pilot-only kinds; upstream wit_leaves has none). DEFAULT since loop round 15 (consensus change: every MNWIT1 root of
# a batch with governance state changes; roots of batches without governance state are identical, l10-fx.log).
# --no-default-features = the round-8 commitment format.
govwit = []
default = ["govwit"]
# loop round 14 (R4-H1 production direction): stateless (witness-fed) segment runner prototype, src/stateless.rs
# (MNWIT-S leaf set, pruned-SMT multiproof loader, completeness guards, end-root recompute). Host-tested.
stateless = []

[dependencies]
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[workspace]
