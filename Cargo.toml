[workspace]
resolver = "2"
members = [
  "crates/minuend-types",
  "crates/minuend-book",
  "crates/minuend-account",
  "crates/minuend-dag",
  "crates/minuend-state",
  "crates/minuend-exec",
  "crates/minuend-settle",
  "crates/minuend-gossip",
  "crates/minuend-watch",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
sha2 = "0.11"
ed25519-dalek = "3"
hex = "0.4"
base64 = "0.23"
flate2 = "1"
minuend-types = { path = "crates/minuend-types" }
minuend-book = { path = "crates/minuend-book" }
minuend-account = { path = "crates/minuend-account" }
minuend-dag = { path = "crates/minuend-dag" }
minuend-state = { path = "crates/minuend-state" }
minuend-exec = { path = "crates/minuend-exec" }
minuend-gossip = { path = "crates/minuend-gossip" }
minuend-settle = { path = "crates/minuend-settle" }

[profile.release]
lto = "thin"
codegen-units = 1
